name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: does it compile and do the storage invariants still hold?
  # Everything else waits on this, so a broken commit never burns publish time.
  # ---------------------------------------------------------------------------
  test:
    name: build + self-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore Kroshka.sln

      - name: Build
        run: dotnet build Kroshka.sln -c Release --no-restore

      - name: Self-test (storage, config, crypto, sessions)
        run: dotnet run --project src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj -c Release --no-build -- --selftest

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            src/DPT.Kroshka.Server/bin/Release/net10.0/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish: three artifacts, one per thing a user actually downloads.
  # ---------------------------------------------------------------------------
  publish:
    name: publish ${{ matrix.name }}
    needs: test
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-win-x64
            project: src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj
            rid: win-x64
            role: server
          - name: server-linux-x64
            project: src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj
            rid: linux-x64
            role: server
          - name: client-win-x64
            project: src/DPT.Kroshka.Client/DPT.Kroshka.Client.csproj
            rid: win-x64
            role: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -o out

      - name: Add runtime files (web, config, docs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/web | Out-Null
          Copy-Item -Recurse -Force web/* out/web/
          Copy-Item -Force config.example.ini out/
          Copy-Item -Force LICENSE out/ -ErrorAction SilentlyContinue
          Copy-Item -Force README.md out/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path out/data, out/logs | Out-Null

          # Prove the archive is not empty before we bother uploading it.
          $exe = if ('${{ matrix.role }}' -eq 'server') {
            if ('${{ matrix.rid }}' -eq 'win-x64') { 'out/KroshkaServer.exe' } else { 'out/KroshkaServer' }
          } else { 'out/Kroshka.exe' }

          if (-not (Test-Path $exe)) { throw "missing $exe" }
          Write-Host "verified $exe ($([Math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Zip
        shell: pwsh
        run: |
          $name = "kroshka-${{ matrix.role }}-${{ matrix.rid }}"
          Compress-Archive -Path out/* -DestinationPath "$name.zip" -CompressionLevel Optimal
          Write-Host "$name.zip -> $([Math]::Round((Get-Item "$name.zip").Length / 1MB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kroshka-${{ matrix.role }}-${{ matrix.rid }}
          path: kroshka-${{ matrix.role }}-${{ matrix.rid }}.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # A release tag turns the same artifacts into a GitHub release.
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
