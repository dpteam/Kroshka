name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: does it compile and do the storage invariants still hold?
  # Everything else waits on this, so a broken commit never burns publish time.
  # ---------------------------------------------------------------------------
  test:
    name: build + self-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore Kroshka.sln

      - name: Build
        run: dotnet build Kroshka.sln -c Release --no-restore

      - name: Self-test (storage, config, crypto, sessions)
        run: dotnet run --project src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj -c Release --no-build -- --selftest

      - name: "Self-test (Linux client: paths, urls, browser, desktop files)"
        run: dotnet run --project src/DPT.Kroshka.Linux/DPT.Kroshka.Linux.csproj -c Release --no-build -- --selftest

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            src/DPT.Kroshka.Server/bin/Release/net10.0/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish: three artifacts, one per thing a user actually downloads.
  # ---------------------------------------------------------------------------
  publish:
    name: publish ${{ matrix.name }}
    needs: test
    # Linux artifacts are packaged on a Linux runner so tar/chmod behave natively;
    # Windows ones stay on Windows. Cross-compiling itself works from either.
    runs-on: ${{ startsWith(matrix.rid, 'linux') && 'ubuntu-latest' || 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-win-x64
            project: src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj
            rid: win-x64
            role: server
          - name: server-linux-x64
            project: src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj
            rid: linux-x64
            role: server
          - name: client-win-x64
            project: src/DPT.Kroshka.Client/DPT.Kroshka.Client.csproj
            rid: win-x64
            role: client
          - name: linux-x64
            project: src/DPT.Kroshka.Linux/DPT.Kroshka.Linux.csproj
            rid: linux-x64
            role: client
          - name: linux-arm64
            project: src/DPT.Kroshka.Linux/DPT.Kroshka.Linux.csproj
            rid: linux-arm64
            role: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -o out

      - name: Add runtime files (web, config, docs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/web | Out-Null
          Copy-Item -Recurse -Force web/* out/web/
          Copy-Item -Force config.example.ini out/
          Copy-Item -Force LICENSE out/ -ErrorAction SilentlyContinue
          Copy-Item -Force README.md out/ -ErrorAction SilentlyContinue
          Remove-Item -Force out/*.pdb -ErrorAction SilentlyContinue

          $isLinux = '${{ matrix.rid }}'.StartsWith('linux')
          if ($isLinux) {
            # The Linux client ships an installer script and themed icons.
            Copy-Item -Force linux/install.sh out/
            New-Item -ItemType Directory -Force -Path out/icons | Out-Null
            Copy-Item -Force web/assets/img/logo-192.png out/icons/kroshka-192.png
            Copy-Item -Force web/assets/img/logo-512.png out/icons/kroshka-512.png
          } else {
            New-Item -ItemType Directory -Force -Path out/data, out/logs | Out-Null
          }

          # Prove the archive is not empty before we bother uploading it.
          $exe = if ('${{ matrix.role }}' -eq 'server') {
            if ($isLinux) { 'out/KroshkaServer' } else { 'out/KroshkaServer.exe' }
          } elseif ($isLinux) { 'out/kroshka' } else { 'out/Kroshka.exe' }

          if (-not (Test-Path $exe)) { throw "missing $exe" }
          Write-Host "verified $exe ($([Math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: "Package (Windows: zip)"
        if: ${{ !startsWith(matrix.rid, 'linux') }}
        shell: pwsh
        run: |
          $name = "kroshka-${{ matrix.role }}-${{ matrix.rid }}"
          Compress-Archive -Path out/* -DestinationPath "$name.zip" -CompressionLevel Optimal
          Write-Host "$name.zip -> $([Math]::Round((Get-Item "$name.zip").Length / 1MB, 1)) MB"

      - name: "Package (Linux: tar.gz)"
        if: ${{ startsWith(matrix.rid, 'linux') }}
        shell: bash
        run: |
          # tar.gz, not zip: zip drops the execute bit and ./kroshka would refuse
          # to start after extraction. tar also keeps install.sh executable.
          name="kroshka-${{ matrix.role }}-${{ matrix.rid }}"

          # install.sh must use LF endings or bash fails with "bad interpreter".
          sed -i 's/\r$//' out/install.sh
          chmod +x out/kroshka out/install.sh

          tar -czf "$name.tar.gz" -C out .
          echo "$name.tar.gz -> $(du -h "$name.tar.gz" | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kroshka-${{ matrix.role }}-${{ matrix.rid }}
          path: |
            kroshka-${{ matrix.role }}-${{ matrix.rid }}.zip
            kroshka-${{ matrix.role }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The installer: the artifact most people actually download. Built on Windows
  # because Inno Setup is Windows-only, from the same published client folder.
  # ---------------------------------------------------------------------------
  installer:
    name: installer (win-x64)
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish the client (self-contained)
        run: >
          dotnet publish src/DPT.Kroshka.Client/DPT.Kroshka.Client.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o bin/self/client-win-x64

      - name: Publish the server (self-contained)
        run: >
          dotnet publish src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o bin/self/server-win-x64

      - name: Add runtime files to both
        shell: pwsh
        run: |
          foreach ($dir in @('bin/self/client-win-x64', 'bin/self/server-win-x64')) {
            New-Item -ItemType Directory -Force -Path "$dir/web" | Out-Null
            Copy-Item -Recurse -Force web/* "$dir/web/"
            New-Item -ItemType Directory -Force -Path "$dir/data", "$dir/logs" | Out-Null
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # The version comes from the tag when releasing, otherwise from the csproj.
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else { '0.0.0-ci' }

          $env:KROSHKA_VERSION = $version
          Write-Host "installer version: $version"

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\kroshka.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

          $setup = Get-ChildItem artifacts/kroshka-*-setup.exe
          if (-not $setup) { throw "installer was not produced" }
          Write-Host "$($setup.Name) -> $([Math]::Round($setup.Length / 1MB, 1)) MB"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kroshka-installer-win-x64
          path: artifacts/kroshka-*-setup.exe
          retention-days: 30

  # ---------------------------------------------------------------------------
  # A tag turns the artifacts into a GitHub release.
  #
  # The tag name decides the kind:
  #   v1.0.0        -> normal release
  #   v1.0.0-rc1    -> pre-release (anything with a suffix)
  #   v1.0.0-beta2  -> pre-release
  #
  # So "ship a pre-release now, promote it later" is just a second tag with the
  # suffix dropped, no hand-editing of the release page.
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: [publish, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Decide release kind
        id: kind
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # A suffix after the version means "not final yet".
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG as a pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG as a normal release"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.kind.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
