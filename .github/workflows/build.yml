name: build

on:
  push:
    branches: [main, master]
    # Tags must be listed explicitly: `branches:` alone means tag pushes never
    # trigger a run, so the release job below would never execute.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: does it compile and do the invariants still hold?
  # Everything else waits on this, so a broken commit never burns publish time.
  # ---------------------------------------------------------------------------
  test:
    name: build + self-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore Kroshka.sln

      - name: Build
        run: dotnet build Kroshka.sln -c Release --no-restore

      - name: "Self-test: server (storage, config, crypto, sessions)"
        run: dotnet run --project src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj -c Release --no-build -- --selftest

      - name: "Self-test: Linux client (xdg, urls, browser, desktop files)"
        run: dotnet run --project src/DPT.Kroshka.Linux/DPT.Kroshka.Linux.csproj -c Release --no-build -- --selftest

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: src/DPT.Kroshka.Server/bin/Release/net10.0/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows artifacts. Split from the Linux job on purpose: one job per runner
  # means a failure names the platform, and neither half can break the other.
  # ---------------------------------------------------------------------------
  publish-windows:
    name: publish windows
    needs: test
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-win-x64
            project: src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj
            artifact: kroshka-server-win-x64
            exe: KroshkaServer.exe
          - name: client-win-x64
            project: src/DPT.Kroshka.Client/DPT.Kroshka.Client.csproj
            artifact: kroshka-client-win-x64
            exe: Kroshka.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o out

      - name: Add runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/web | Out-Null
          Copy-Item -Recurse -Force web/* out/web/
          Copy-Item -Force config.example.ini out/
          Copy-Item -Force LICENSE out/ -ErrorAction SilentlyContinue
          Copy-Item -Force README.md out/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path out/data, out/logs | Out-Null
          Remove-Item -Force out/*.pdb -ErrorAction SilentlyContinue

          # Prove the archive is not empty before uploading it.
          $exe = "out/${{ matrix.exe }}"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          Write-Host "verified $exe ($([Math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Zip
        shell: pwsh
        run: |
          $name = "${{ matrix.artifact }}"
          Compress-Archive -Path out/* -DestinationPath "$name.zip" -CompressionLevel Optimal
          Write-Host "$name.zip -> $([Math]::Round((Get-Item "$name.zip").Length / 1MB, 1)) MB"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Linux artifacts, built and packaged on a Linux runner: tar and chmod behave
  # natively, so the execute bit and the LF endings of install.sh survive.
  # ---------------------------------------------------------------------------
  publish-linux:
    name: publish linux (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux build is client and server in one binary.
          - arch: x64
            rid: linux-x64
            artifact: kroshka-linux-x64
          - arch: arm64
            rid: linux-arm64
            artifact: kroshka-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish
        run: >
          dotnet publish src/DPT.Kroshka.Linux/DPT.Kroshka.Linux.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -o out

      - name: Add runtime files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/web out/icons
          cp -r web/. out/web/
          cp config.example.ini out/
          cp LICENSE out/ 2>/dev/null || true
          cp README.md out/ 2>/dev/null || true
          cp linux/install.sh out/
          cp linux/README.md out/LINUX.md 2>/dev/null || true

          cp web/assets/img/logo-192.png out/icons/kroshka-192.png
          cp web/assets/img/logo-512.png out/icons/kroshka-512.png

          rm -f out/*.pdb

          # install.sh must have LF endings or bash fails with "bad interpreter".
          sed -i 's/\r$//' out/install.sh
          chmod +x out/kroshka out/install.sh

          test -x out/kroshka || { echo "::error::kroshka is not executable"; exit 1; }
          echo "verified out/kroshka ($(du -h out/kroshka | cut -f1))"

      - name: Package tar.gz
        shell: bash
        run: |
          set -euo pipefail
          # tar.gz, not zip: zip drops the execute bit and ./kroshka would refuse
          # to start after extraction.
          name="${{ matrix.artifact }}"
          tar -czf "$name.tar.gz" -C out .
          echo "$name.tar.gz -> $(du -h "$name.tar.gz" | cut -f1)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The installer: the artifact most people actually download. Windows only,
  # because Inno Setup is Windows only.
  # ---------------------------------------------------------------------------
  installer:
    name: installer
    needs: [publish-windows]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish the client
        run: >
          dotnet publish src/DPT.Kroshka.Client/DPT.Kroshka.Client.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o bin/self/client-win-x64

      - name: Publish the server
        run: >
          dotnet publish src/DPT.Kroshka.Server/DPT.Kroshka.Server.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o bin/self/server-win-x64

      - name: Add runtime files
        shell: pwsh
        run: |
          foreach ($dir in @('bin/self/client-win-x64', 'bin/self/server-win-x64')) {
            New-Item -ItemType Directory -Force -Path "$dir/web" | Out-Null
            Copy-Item -Recurse -Force web/* "$dir/web/"
            New-Item -ItemType Directory -Force -Path "$dir/data", "$dir/logs" | Out-Null
            Remove-Item -Force "$dir/*.pdb" -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # A tag decides the version; a branch build is explicitly not a release.
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else { '0.0.0-ci' }

          $env:KROSHKA_VERSION = $version
          Write-Host "installer version: $version"

          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) { throw "ISCC.exe not found after install" }

          & $iscc installer\kroshka.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

          $setup = Get-ChildItem artifacts/kroshka-*-setup.exe
          if (-not $setup) { throw "installer was not produced" }
          Write-Host "$($setup.Name) -> $([Math]::Round($setup.Length / 1MB, 1)) MB"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kroshka-installer-win-x64
          path: artifacts/kroshka-*-setup.exe
          retention-days: 30

  # ---------------------------------------------------------------------------
  # A tag turns the artifacts into a GitHub release.
  #
  #   v1.0.0        -> normal release
  #   v1.0.0-rc1    -> pre-release (anything with a suffix)
  #
  # So "ship a pre-release now, promote it later" is just a second tag with the
  # suffix dropped, no hand-editing of the release page.
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: [publish-windows, publish-linux, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Decide release kind
        id: kind
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # A suffix after the version means "not final yet".
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG as a pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG as a normal release"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.kind.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
