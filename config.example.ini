; =============================================================================
;  Kroshka — config.example.ini
;
;  Copy this file to config.ini and edit. Every feature has a switch here: the
;  point of Kroshka is that a family shapes it, not that it ships opinions.
;
;  Rules:
;    * Sections are [name], keys are key=value, ';' or '#' start a comment.
;    * Unknown keys are ignored, bad values fall back to safe defaults.
;    * A broken file never stops the server; it quarantines and warns.
;    * Settings changed from the admin board are stored in data/overrides.json
;      and win over this file, so your comments here stay intact.
; =============================================================================


; -----------------------------------------------------------------------------
; [server] — where the messenger listens
; -----------------------------------------------------------------------------
[server]
; 0.0.0.0 = every interface, so phones and ZeroTier friends can connect.
; Use 127.0.0.1 to keep it strictly on this machine.
bind = 0.0.0.0

; The main port. 6767 was free on a default Windows install when this was written.
port = 6767

; If the port is taken, try these in order instead of failing to start.
portFallbacks = 6768, 6769, 6770

; Advertised address, only used for links in the UI. Empty = auto.
publicUrl =

; Largest single upload. Keep it sane: this is a LAN chat, not a CDN.
maxUploadMb = 64

; How long a request may take before Kestrel gives up.
requestTimeoutSec = 60

; Trust X-Forwarded-For. Turn on only behind a reverse proxy you control.
trustProxy = false


; -----------------------------------------------------------------------------
; [site] — what people see
; -----------------------------------------------------------------------------
[site]
name = Kroshka
shortName = K
tagline = Мессенджер для своих
description =

; Interface language and the theme a new device starts with: light | dark | oled
language = ru
theme = light

; Are sounds on for someone who has never opened the settings?
defaultSound = true

; A line shown on the login screen. Handy for "сервер работает до 23:00".
motd =

; Small print at the bottom of the app.
footer =

; Shown in the profile drawer so people know who to ask for an invite.
supportEmail =


; -----------------------------------------------------------------------------
; [branding] — repaint the whole app without touching CSS
;
; Every value is a hex colour. Leave the file alone for the neutral palette.
; The light palette is the DPT blue; the dark and OLED palettes are tuned to
; keep text contrast above 7:1 while staying comfortable at night.
; -----------------------------------------------------------------------------
[branding]
; Optional logo image URL, shown instead of the letter mark.
logo =

; Primary brand colour and its two shades.
accent = #0088FF
accentHi = #0080FF
accentLo = #0066CC

; Light theme
lightBg = #FFFFFF
lightPanel = #F6F8FB
lightPanel2 = #EDF1F7
lightText = #0B1622

; Dark theme — deep navy rather than grey, so the blue accent still reads as blue.
darkBg = #0A0F1A
darkPanel = #111A29
darkPanel2 = #16202F
darkText = #E6EDF7

; OLED theme — true black background for power saving and pure contrast.
oledBg = #000000
oledPanel = #05080D
oledPanel2 = #0A1018
oledText = #E8EEF6


; -----------------------------------------------------------------------------
; [auth] — how someone gets in
;
;   open      pick a nickname and you are in. LAN default, zero friction.
;   password  nickname plus one shared household password.
;   invite    nickname plus a code you hand out (good for ZeroTier friends).
;
; In every mode the device remembers you, so a family member logs in once.
; -----------------------------------------------------------------------------
[auth]
mode = open

; Can a stranger create a new account? Turn off after everyone has joined.
allowRegister = true

; Used when mode = password. Change it before exposing the server.
password =

; Used when mode = invite. Something long and unguessable.
inviteCode =

; How long "remember me" lasts. 365 = a year; the device token is revocable
; from the profile drawer if a phone gets lost.
rememberDays = 365

; How long a session lasts when "remember me" is off.
sessionDays = 30

; Longest allowed nickname.
maxNickLen = 24

; Can people rename themselves, or is the owner the only one who can?
allowNickChange = true

; The very first account becomes the owner, so a fresh server is administrable.
firstUserAdmin = true

; Brute force protection for the login form.
maxFailedLoginsPerIp = 30
loginLockSeconds = 120


; -----------------------------------------------------------------------------
; [limits] — spam guards. Generous by default: a family is not an attack.
; -----------------------------------------------------------------------------
[limits]
maxMessageLen = 8000
messagesPerMin = 120
uploadsPerMin = 30
maxAvatarKb = 4096
maxVoiceSec = 300

; How many messages one page of history holds.
pageSize = 50


; -----------------------------------------------------------------------------
; [storage] — where the data lives
; -----------------------------------------------------------------------------
[storage]
; All paths are relative to the folder that holds config.ini.
dataDir = data
blobDir = data/blobs
backupDir = data/backups

; How many timestamped backups to keep. The oldest is deleted on rotation.
keepBackups = 10

; Automatic prune of old messages, in months. 0 = keep everything forever.
; The admin board can also prune manually, and it always asks first.
pruneMonths = 0

; Automatic backup interval in hours. 0 disables the timer.
autoBackupHours = 24


; -----------------------------------------------------------------------------
; [admin] — the board on its own port
;
; A separate listener means /api/admin/* does not exist on the public port at
; all: a leaked chat URL is never a leaked admin panel.
; -----------------------------------------------------------------------------
[admin]
enabled = true
port = 6768
portFallbacks = 6769, 6770, 6771
bind = 0.0.0.0

; The board's own password, independent of any chat account. There is deliberately
; no default: an unset password means the board refuses every login, and it says so
; on its own login screen. Set something long before you use it.
password =

; Bind the board to loopback only, so it is reachable solely from this machine.
localOnly = false


; -----------------------------------------------------------------------------
; [log] — Trace based, no App.config, no duplicate listeners
;
; Files rotate daily and by size, and old ones are pruned. Request tracing is
; separate from the level so you can keep quiet logs but still see traffic.
; -----------------------------------------------------------------------------
[log]
; error | warn | info | debug | verbose
level = info
dir = logs
maxFileMb = 16
retentionDays = 30

; One line per HTTP request: method, path, status, duration. Never bodies.
apiTrace = true

; How many recent entries stay in memory for the admin log viewer.
ringSize = 2000


; -----------------------------------------------------------------------------
; [features] — every feature has a switch
;
; Turn off what your family does not need. A disabled feature disappears from
; the interface and its endpoints answer 403, so there is no half-working UI.
; -----------------------------------------------------------------------------
[features]
reactions = true
replies = true
pins = true
voice = true
files = true
search = true
typing = true
presence = true
edit = true
delete = true
rooms = true
dm = true

; How long after sending a message it may still be edited / deleted.
; 0 = no limit. Applies to the author; moderators are not limited.
editWindowMin = 0
deleteWindowMin = 0

; Reserved for the WebRTC phase. Signalling already travels over the socket,
; so turning this on later does not require a protocol change.
calls = false
